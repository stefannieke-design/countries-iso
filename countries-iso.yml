version: 1.0.0
kind: DataContract
id: 2a3b8c1d-9e4f-5a6b-7c8d-9e0f1a2b3c4d
status: active
name: countries
dataProduct: refman_countries
description:
  purpose: Reference list of world countries with ISO codes and region classification
  limitations: Contains only a subset of countries for demonstration
  usage: Master data for country selection across the application
tenant: Refman
apiVersion: v3.1.0

schema:
  - id: countries
    name: countries
    physicalType: table
    description: ISO country codes and region classification
    tags: ['master-data', 'countries', 'reference']
    properties:
      - id: country_name
        name: Country Name
        businessName: Country Name
        logicalType: string
        required: true
        description: Full official name of the country
        examples:
          - "Australia"
          - "Germany"
        quality:
          - metric: nullValues
            mustBe: 0
            description: Country name must not be null
            dimension: completeness
            severity: error

      - id: alpha_2
        name: Alpha-2
        businessName: Alpha-2 Code
        logicalType: string
        physicalType: varchar(2)
        required: true
        unique: true
        description: Two-letter ISO country code (ISO 3166-1 alpha-2)
        examples:
          - "AU"
          - "DE"
        logicalTypeOptions:
          minLength: 2
          maxLength: 2

      - id: alpha_3
        name: Alpha-3
        businessName: Alpha-3 Code
        logicalType: string
        physicalType: varchar(3)
        required: true
        unique: true
        description: Three-letter ISO country code (ISO 3166-1 alpha-3)
        examples:
          - "AUS"
          - "DEU"
        logicalTypeOptions:
          minLength: 3
          maxLength: 3

      - id: numeric
        name: Numeric
        businessName: Numeric Code
        logicalType: string
        physicalType: varchar(3)
        required: true
        unique: true
        description: Three-digit ISO country code (ISO 3166-1 numeric)
        examples:
          - "036"
          - "276"
        logicalTypeOptions:
          minLength: 3
          maxLength: 3

      - id: region
        name: Region
        businessName: Region
        logicalType: string
        required: true
        description: Geographic region classification - references the regions table
        examples:
          - "Oceania"
          - "Europe"
        relationships:
          - to: schema/regions/properties/region_name
            type: foreignKey

      - id: sub_region                          # NEU
        name: Sub-Region
        businessName: Sub-Region
        logicalType: string
        required: false
        description: >
          Geographic sub-region classification - references the sub_regions table.
          Allows finer-grained grouping within a continent (e.g. "Western Europe",
          "Southeast Asia").
        examples:
          - "Australia and New Zealand"
          - "Western Europe"
        relationships:
          - to: schema/sub_regions/properties/sub_region_name
            type: foreignKey

  - id: regions
    name: regions
    physicalType: table
    description: Geographic regions (continents) for country classification
    tags: ['master-data', 'regions', 'reference']
    properties:
      - id: region_name
        name: Region Name
        businessName: Region Name
        logicalType: string
        required: true
        unique: true
        description: Full name of the geographic region or continent
        examples:
          - "Oceania"
          - "Europe"
          - "Asia"
          - "Africa"
          - "North America"
          - "South America"
        quality:
          - metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error

      - id: region_code
        name: Region Code
        businessName: Region Code
        logicalType: string
        physicalType: varchar(2)
        required: false
        unique: true
        description: Short code for the region
        examples:
          - "OC"
          - "EU"
          - "AS"
          - "AF"
          - "NA"
          - "SA"

  - id: sub_regions                             # NEU
    name: sub_regions
    physicalType: table
    description: >
      Geographic sub-regions for finer country classification.
      Each sub-region belongs to exactly one parent region.
    tags: ['master-data', 'sub-regions', 'reference']
    properties:
      - id: sub_region_name
        name: Sub-Region Name
        businessName: Sub-Region Name
        logicalType: string
        required: true
        unique: true
        description: Full name of the geographic sub-region
        examples:
          - "Australia and New Zealand"
          - "Western Europe"
          - "Southeast Asia"
          - "Sub-Saharan Africa"
          - "Northern America"
          - "South America"
        quality:
          - metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error

      - id: sub_region_code
        name: Sub-Region Code
        businessName: Sub-Region Code
        logicalType: string
        physicalType: varchar(4)
        required: false
        unique: true
        description: Short code for the sub-region (up to 4 characters)
        examples:
          - "OCAU"
          - "EUWE"
          - "ASSE"
          - "AFSS"
          - "AMNO"
          - "AMSO"
        logicalTypeOptions:
          maxLength: 4

      - id: parent_region
        name: Parent Region
        businessName: Parent Region
        logicalType: string
        required: true
        description: >
          The parent continent/region this sub-region belongs to -
          references the regions table.
        examples:
          - "Oceania"
          - "Europe"
        relationships:
          - to: schema/regions/properties/region_name
            type: foreignKey